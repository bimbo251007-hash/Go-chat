herename: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (build + database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
      - name: Typecheck / build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Fresh install schema
        run: psql -v ON_ERROR_STOP=1 -d app -f schema.sql
      - name: Upgrade path (old schema, then migrations in order)
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE upgrade"
          # schema.sql قبل أول migration بتاع الجروبات = النسخة القديمة
          python3 - <<'PY'
          s = open("schema.sql", encoding="utf-8").read()
          open("/tmp/old_schema.sql", "w", encoding="utf-8").write(s[: s.index("-- الجروبات")])
          PY
          psql -v ON_ERROR_STOP=1 -d upgrade -f /tmp/old_schema.sql
          for f in migrations/006_groups_snaps.sql migrations/007_avatars.sql; do
            psql -v ON_ERROR_STOP=1 -d upgrade -f "$f"
            psql -v ON_ERROR_STOP=1 -d upgrade -f "$f"   # لازم تتشغل مرتين من غير مشاكل
          done
      - name: Server boots and answers /health
        env:
          NODE_ENV: development
          DATABASE_URL: postgres://postgres:ci@localhost:5432/app
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          MEDIA_DIR: ${{ runner.temp }}/uploads
          PORT: "3000"
        run: |
          node dist/index.js &
          pid=$!
          for i in $(seq 1 20); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/health
          # من غير توكن لازم يترفض
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/conversations)" = "401"
          kill $pid

  mobile:
    name: Mobile (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform scaffold and apply our sources
        run: |
          flutter create --org com.example --project-name chat_app "$RUNNER_TEMP/scaffold"
          rm -rf "$RUNNER_TEMP/scaffold/lib" "$RUNNER_TEMP/scaffold/test"
          cp -r mobile/lib "$RUNNER_TEMP/scaffold/lib"
          cp mobile/pubspec.yaml "$RUNNER_TEMP/scaffold/pubspec.yaml"
      - name: Pub get
        working-directory: ${{ runner.temp }}/scaffold
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ runner.temp }}/scaffold
        run: flutter analyze --no-fatal-infos
