name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: "عنوان السيرفر (مثال: http://192.168.1.10:3000). سيبه فاضي لمحاكي أندرويد"
        required: false
        default: ""
      build_mode:
        description: "نوع البناء (release بيحتاج https)"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:ci_password@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if ! find . -type f -path '*/server/package.json' -not -path './.git/*' | grep -q .; then
            Z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              unzip -q -o "$Z" -d extracted
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect server folder
        run: |
          P=$(find . -type f -path '*/server/package.json' -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            P=$(grep -rl --include=package.json '"chat-server"' . --exclude-dir=node_modules | head -1)
          fi
          if [ -z "$P" ]; then
            echo "::error::مش لاقي مجلد السيرفر (server/package.json). ده شكل الريبو:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          SERVER_DIR=$(dirname "$P")
          echo "Server folder: $SERVER_DIR"
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"

      - name: Fix push.ts type error
        run: |
          sed -i 's/^  return sa;$/  return sa ?? null;/' "$SERVER_DIR/src/push.ts"
          sed -n 10,16p "$SERVER_DIR/src/push.ts"

      - name: Install
        run: cd "$SERVER_DIR" && npm install

      - name: Build (tsc)
        run: cd "$SERVER_DIR" && npm run build

      - name: Load schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$SERVER_DIR/schema.sql"

      - name: Smoke test
        env:
          NODE_ENV: development
          PORT: "3000"
          MEDIA_DIR: ./uploads
        run: |
          cd "$SERVER_DIR"
          export JWT_SECRET="$(openssl rand -hex 48)"
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then echo; echo "Server OK"; exit 0; fi
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'debug' }}
      SERVER_URL: ${{ inputs.server_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if ! find . -type f -path '*/mobile/pubspec.yaml' -not -path './.git/*' | grep -q .; then
            Z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              unzip -q -o "$Z" -d extracted
            fi
          fi

      - name: Detect mobile folder
        run: |
          P=$(find . -type f -path '*/mobile/pubspec.yaml' -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            P=$(grep -rl --include=pubspec.yaml '^name: chat_app' . | head -1)
          fi
          if [ -z "$P" ]; then
            echo "::error::مش لاقي مجلد التطبيق (mobile/pubspec.yaml). ده شكل الريبو:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          MOBILE_DIR=$(dirname "$P")
          echo "Mobile folder: $MOBILE_DIR"
          echo "MOBILE_DIR=$MOBILE_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name chat_app --org com.example.chatapp build_app
          rm -rf build_app/lib build_app/test
          cp -r "$MOBILE_DIR/lib" build_app/lib
          cp "$MOBILE_DIR/pubspec.yaml" build_app/pubspec.yaml

      - name: Upgrade record package
        run: |
          sed -i 's/^  record: .*/  record: ^6.0.0/' build_app/pubspec.yaml
          grep -n "record" build_app/pubspec.yaml

      - name: Set server URL
        if: env.SERVER_URL != ''
        run: |
          API="${SERVER_URL%/}"
          WS="${API/https:\/\//wss://}"
          WS="${WS/http:\/\//ws://}"
          printf "const apiBase = '%s';\nconst wsBase = '%s';\n" "$API" "$WS" > build_app/lib/core/config.dart
          cat build_app/lib/core/config.dart

      - name: Patch Android (permissions, cleartext, minSdk)
        run: |
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$M"
          if [ "$BUILD_MODE" = "debug" ]; then
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          fi
          sed -i 's/flutter\.minSdkVersion/23/' build_app/android/app/build.gradle*
          cat "$M"

      - name: Pub get
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library') || p.plugins.hasPlugin('com.android.application')) {
                p.android.compileSdk = 36
              }
            }
          }
          EOF
          cat ~/.gradle/init.d/force-sdk.gradle

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --${{ env.BUILD_MODE }}

      - uses: actions/upload-artifact@v4
        with:
          name: chat-app-${{ env.BUILD_MODE }}-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
